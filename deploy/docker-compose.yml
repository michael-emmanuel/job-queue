# Local 3-node cluster. Secrets are generated by `make compose-env` into
# deploy/.env (git-ignored); nothing sensitive is committed.
x-common: &common
  image: jobqueue:dev
  restart: unless-stopped
  environment: &env
    JOBQUEUE_CLUSTER_SECRET: ${JOBQUEUE_CLUSTER_SECRET:?run make compose-env}
    JOBQUEUE_API_KEYS: ${JOBQUEUE_API_KEYS:?run make compose-env}
    JOBQUEUE_PEERS: coord=http://coord:7000,n1=http://n1:7000,n2=http://n2:7000,n3=http://n3:7000

services:
  coord:
    <<: *common
    entrypoint: ["coordinator", "-name=coord", "-listen=:7000", "-admin-listen=:9000", "-dir=/data"]
    volumes: ["coord:/data"]
  n1: &node
    <<: *common
    entrypoint: ["node", "-name=n1", "-listen=:7000", "-admin-listen=:9000", "-dir=/data"]
    volumes: ["n1:/data"]
    depends_on: [coord]
  n2:
    <<: *node
    entrypoint: ["node", "-name=n2", "-listen=:7000", "-admin-listen=:9000", "-dir=/data"]
    volumes: ["n2:/data"]
  n3:
    <<: *node
    entrypoint: ["node", "-name=n3", "-listen=:7000", "-admin-listen=:9000", "-dir=/data"]
    volumes: ["n3:/data"]
  gateway:
    <<: *common
    entrypoint: ["gateway", "-name=gateway", "-listen=:8080", "-admin-listen=:9000"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [n1, n2, n3]
  worker:
    <<: *common
    entrypoint: ["worker", "-queue=demo", "-group=demo-workers", "-api=http://gateway:8080", "-admin-listen=:9000", "-concurrency=8"]
    environment:
      JOBQUEUE_TOKEN: ${WORK_KEY:?run make compose-env}
    deploy: {replicas: 3}
    depends_on: [gateway]
  scheduler:
    <<: *common
    entrypoint: ["scheduler", "-api=http://gateway:8080", "-config=/etc/jobqueue/schedules.json"]
    environment:
      JOBQUEUE_TOKEN: ${PROD_KEY:?run make compose-env}
    volumes: ["./schedules.json:/etc/jobqueue/schedules.json:ro"]
    depends_on: [gateway]
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./prometheus:/etc/prometheus:ro"]
    ports: ["127.0.0.1:9091:9090"]

volumes: {coord: {}, n1: {}, n2: {}, n3: {}}
